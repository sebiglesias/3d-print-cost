<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cyberBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D14"/>
      <stop offset="100%" stop-color="#141C2A"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8800"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#cyberBg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#FF6B00" stroke-opacity="0.35" stroke-width="4"/>
  
  <!-- Heat block and nozzle -->
  <rect x="216" y="80" width="80" height="44" rx="6" fill="#475569"/>
  <polygon points="256,190 232,124 280,124" fill="#FBBF24"/>
  <circle cx="256" cy="192" r="5" fill="#FFFBEB"/>

  <!-- 3D printed cube being extruded with neon cyber glow -->
  <polygon points="256,220 346,265 256,310 166,265" fill="url(#neonCyan)" stroke="#38BDF8" stroke-width="4"/>
  <polygon points="166,265 256,310 256,400 166,355" fill="#0284C7" stroke="#0369A1" stroke-width="4"/>
  <polygon points="256,310 346,265 346,355 256,400" fill="#0369A1" stroke="#075985" stroke-width="4"/>

  <!-- Heated PEI bed base with Prusa orange glow -->
  <rect x="80" y="426" width="352" height="20" rx="6" fill="#1E293B" stroke="url(#neonOrange)" stroke-width="5"/>
</svg>
